# @file ci.yml
# @description Push/PR gate: install, build server + client (tsc is the
#   typecheck), and run the unit tests. Until this existed every fix shipped
#   on a local typecheck alone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          npm ci

      - name: Build client
        run: npm run build:client

      - name: Build server + run tests
        run: npm test
